name: zizmor

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
  # The online audits (known-vulnerable-actions, impostor-commit, ...) can turn
  # up problems in actions that haven't changed here, so also run weekly.
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repo
      security-events: write # upload findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Findings are uploaded to code scanning (the action's default), which
      # shows them on the Security tab and on the PRs that introduce them.
      # The online audits use the job's token.
      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.9.2
