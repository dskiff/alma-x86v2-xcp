name: Release

# Builds every image and publishes them as one release, versioned
# v0.<UTC date>.<patch> (see scripts/release-version.sh). A run releases only
# when scripts/release-plan.sh finds a reason to:
#   - scheduled: the first and third Monday of each month
#   - a template's source ISO changed since the latest release
#   - a manual run, such as for a security fix. From a branch other than
#     main, it makes a pre-release instead.
# Image changes merged to main wait for the next of these.

on:
  # Daily rather than only on Mondays. Cron can't express "first and third
  # Monday" (given both a day of the month and a weekday, it fires when either
  # matches), and a Monday run that GitHub drops, or that fails, is retried the
  # next day. Off the hour, when GitHub delays scheduled runs the most.
  schedule:
    - cron: "37 9 * * *"
  # Renovate's ISO bumps, released as soon as they merge. The plan compares the
  # ISOs with the latest release's, so other template changes don't release.
  push:
    branches: [main]
    paths: ["alma*.pkr.hcl"]
  workflow_dispatch:
    inputs:
      reason:
        description: Why release now (goes into the release notes)
        required: true
        type: string

permissions: {}

# One release run at a time, whatever started it, so two runs can't plan
# against the same latest release. A run waiting here is replaced by a newer
# one. A run on main re-checks every reason, so a replaced scheduled or ISO
# release still happens, at the latest on the next daily run; a replaced
# manual run is lost.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the repo and list its releases
    outputs:
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      date: ${{ steps.plan.outputs.date }}
      base: ${{ steps.plan.outputs.base }}
      reasons: ${{ steps.plan.outputs.reasons }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # With tags: the plan reads the latest release's templates.
          fetch-depth: 0

      # Published releases only, with when each was published: a failed
      # attempt's tag or draft doesn't count as a release.
      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REASON: ${{ inputs.reason }}
        run: |
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | "\(.tag_name) \(.published_at)"' \
            | scripts/release-plan.sh

  # The same checks as a PR, on the commit about to be released. Among them,
  # verify-iso.sh fails within a minute when a point release has moved an ISO
  # to vault, before anything is tagged.
  ci:
    name: CI
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read # check out the repo
    # A local reusable workflow runs from this run's own commit, as
    # documented for ./ paths; the $/ form zizmor suggests is for actions.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  # scripts/release-draft.sh tags the commit with the next version, which
  # reserves it (creating a tag that exists fails), and creates the draft the
  # images upload to; the publish job releases it once every image is attached.
  # A re-run of this run reuses its draft, and drafts that failed runs left
  # behind are deleted, so at most one unpublished draft is ever kept. A retry
  # whose plan predates the latest release fails instead of releasing.
  draft:
    name: Draft release
    needs: [plan, ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and the draft release, delete stale drafts
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Find or create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.plan.outputs.date }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SHA: ${{ github.sha }}
          BASE: ${{ needs.plan.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/release-draft.sh

  images:
    name: Image (${{ matrix.image }})
    needs: draft
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    # Write access is for the upload step. Passing the images to a separate
    # job would mean storing GBs as workflow artifacts.
    permissions:
      contents: write # upload the images to the release
    strategy:
      fail-fast: false
      matrix:
        image: [alma9, alma10]
    env:
      IMAGE: ${{ matrix.image }}
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # devbox.json is the single source of truth for tool versions (and is
      # what Renovate bumps), so CI uses the same Packer as `devbox shell`.
      - name: Read Packer version from devbox.json
        id: version
        run: |
          version="$(jq -er '.packages[] | select(startswith("packer@")) | ltrimstr("packer@")' devbox.json)"
          echo "packer=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: ${{ steps.version.outputs.packer }}

      # Ubuntu's QEMU rather than devbox's; the image doesn't depend on which
      # QEMU builds it.
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils zstd

      # The runners support KVM, but /dev/kvm is root-only by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [[ ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm isn't available on this runner"
            exit 1
          fi

      # Plugin discovery hits the GitHub API; authenticate so the shared
      # per-IP anonymous rate limit can't fail the job. Scoped to this step
      # only: build.sh's own `packer init` then finds the plugin installed.
      - name: packer init
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: packer init .

      # KVM instead of the templates' default TCG, which dev machines need.
      # The guest still sees an Ivy Bridge CPU. The VM gets every vCPU the
      # runner has, but only 4 GiB: that is enough for the text-mode install
      # and leaves the host room for QEMU.
      #
      # A failed build deletes its directory, serial.log included, so the
      # guest's console is copied into the job log as it's written. The prefix
      # stops a guest line from starting with "::" (a workflow command).
      - name: Build
        env:
          PKR_VAR_accelerator: kvm
          PKR_VAR_memory: "4096"
          PKR_VAR_release: ${{ env.TAG }}
        run: |
          (
            shopt -s nullglob
            until logs=(output/"alma_${IMAGE#alma}"_*/serial.log); ((${#logs[@]})); do
              sleep 5
            done
            tail -n +1 -F "${logs[0]}" 2>/dev/null | sed -u 's/^/serial| /'
          ) &
          watcher=$!
          trap 'pkill -P "${watcher}" || true; kill "${watcher}" 2>/dev/null || true' EXIT
          PKR_VAR_cpus="$(nproc)" ./build.sh "${IMAGE}"

      # Release assets must be under 2 GiB, which the raw VHD may not be, so it
      # ships zstd-compressed. Each image also gets a checksum file (for the
      # .vhd and the .vhd.zst) and a tarball of the rest of its build
      # directory: the build evidence and the serial log.
      #
      # Assets are named <image>-<AlmaLinux version>-<release>, such as
      # alma9-9.9-v0.20261207.0.vhd.zst. The version is the one the image has
      # installed, which comes from the floating repositories rather than the
      # ISO: when the two differ, AlmaLinux has shipped a point release and the
      # ISO needs bumping, so the build fails rather than ship an installer
      # older than its packages.
      - name: Package
        id: package
        run: |
          shopt -s nullglob
          dirs=(output/"alma_${IMAGE#alma}"_*/)
          if [[ ${#dirs[@]} -ne 1 ]]; then
            echo "::error::Expected one build directory for ${IMAGE}, found ${#dirs[@]}"
            exit 1
          fi
          build_dir="${dirs[0]%/}"
          build_name="${build_dir##*/}"

          installed="$(sed -nE 's/^VERSION_ID="?([0-9]+\.[0-9]+)"?$/\1/p' "${build_dir}/build-evidence/os-release")"
          iso="$(sed -nE 's|^[[:space:]]*iso_url[[:space:]]*=.*/AlmaLinux-([0-9]+\.[0-9]+)-[^/"]*-boot\.iso".*$|\1|p' "${IMAGE}.pkr.hcl")"
          if [[ ! "${installed}" =~ ^[0-9]+\.[0-9]+$ || "${installed}" != "${iso}" ]]; then
            echo "::error::${IMAGE} installed AlmaLinux '${installed}' with the '${iso}' installer; bump the ISO in ${IMAGE}.pkr.hcl"
            exit 1
          fi

          name="${IMAGE}-${installed}-${TAG}"
          dist="${RUNNER_TEMP}/dist"
          mkdir -p "${dist}"

          zstd -T0 -12 -q -o "${dist}/${name}.vhd.zst" "${build_dir}/${build_name}.vhd"
          # The build's own digest of the .vhd, under the name it decompresses to.
          read -r digest _ <"${build_dir}/SHA256SUMS"
          if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::${build_dir}/SHA256SUMS doesn't start with a SHA-256 digest"
            exit 1
          fi
          printf '%s  %s\n' "${digest}" "${name}.vhd" >"${dist}/${name}.SHA256SUMS"
          (cd "${dist}" && sha256sum "${name}.vhd.zst" >> "${name}.SHA256SUMS")
          tar -C "${build_dir}" --exclude="${build_name}.vhd" --exclude="packer-${IMAGE}" \
            -czf "${dist}/${name}.evidence.tar.gz" .

          for f in "${dist}"/*; do
            if (( $(stat -c %s "${f}") >= 2 * 1024 ** 3 )); then
              echo "::error::${f##*/} exceeds GitHub's 2 GiB limit for release assets"
              exit 1
            fi
          done
          ls -l "${dist}"
          echo "dist=${dist}" >> "$GITHUB_OUTPUT"

      # A re-run uploads the same names again, unless the AlmaLinux version
      # changed in between, so this image's other assets are removed once the
      # new ones are up.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ steps.package.outputs.dist }}
        run: |
          prefix="${IMAGE}-"
          old="$(gh release view "${TAG}" --json assets \
            --jq ".assets[].name | select(startswith(\"${prefix}\"))")"
          gh release upload "${TAG}" "${DIST}"/* --clobber
          while IFS= read -r asset; do
            if [[ -n "${asset}" && ! -e "${DIST}/${asset}" ]]; then
              gh release delete-asset "${TAG}" "${asset}" --yes
            fi
          done <<<"${old}"

  publish:
    name: Publish release
    needs: [plan, draft, images]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # write the notes and publish the draft release
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      BASE: ${{ needs.plan.outputs.base }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # scripts/release-notes.sh writes the title and notes: why this release
      # happened, the images, and each image's package changes since the
      # previous full release, from the packages.txt in the evidence. Then the
      # repository changes: GitHub's generated notes, counted from that same
      # release so that pre-releases don't cut the range short.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REASONS: ${{ needs.plan.outputs.reasons }}
        run: |
          work="${RUNNER_TEMP}/notes"
          mkdir -p "${work}/current" "${work}/previous"
          gh release download "${TAG}" --dir "${work}/current" \
            --pattern '*.evidence.tar.gz' --pattern '*.SHA256SUMS'
          args=(-f "tag_name=${TAG}")
          if [[ -n "${BASE}" ]]; then
            gh release download "${BASE}" --dir "${work}/previous" --pattern '*.evidence.tar.gz'
            args+=(-f "previous_tag_name=${BASE}")
          fi
          printf '%s\n' "${REASONS}" >"${work}/reasons.txt"
          gh api --method POST "repos/${GH_REPO}/releases/generate-notes" "${args[@]}" \
            --jq .body >"${work}/changes.md"
          scripts/release-notes.sh "${work}"
          cat "${work}/title" "${work}/notes.md"

      # "legacy" lets GitHub pick the latest release by creation date and
      # version, which agree in this scheme. Publishing marks itself latest by
      # default, so a re-run that finishes an older draft would otherwise
      # displace a newer release. A pre-release is never the latest.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work="${RUNNER_TEMP}/notes"
          latest=legacy
          if [[ "${PRERELEASE}" == true ]]; then
            latest=false
          fi
          id="$(gh release view "${TAG}" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/${GH_REPO}/releases/${id}" \
            -F draft=false -f "make_latest=${latest}" \
            -f "name=$(<"${work}/title")" -F "body=@${work}/notes.md" \
            --jq '"Published \(.html_url)"'
